<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <title>CRM, SCM, ERP y Gestión del conocimiento</title>
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <style>
      :root {
        --bg: #f4f5fa;
        --cd: #fff;
        --tx: #1b1e2b;
        --mu: #5b6075;
        --bd: #e0e3ee;
        --crm: #2563eb;
        --scm: #c2410c;
        --erp: #0f766e;
        --km: #6d28d9;
        --rel: #334155;
        box-sizing: border-box;
        padding-top: env(safe-area-inset-top, 0px);
        padding-bottom: env(safe-area-inset-bottom, 0px);
      }
      @media (prefers-color-scheme: dark) {
        :root:not([data-theme='light']) {
          --bg: #0e1120;
          --cd: #181c2f;
          --tx: #eef0f8;
          --mu: #a3a9c4;
          --bd: #2a3050;
          --crm: #60a5fa;
          --scm: #fb923c;
          --erp: #2dd4bf;
          --km: #a78bfa;
          --rel: #cbd5e1;
        }
      }
      :root[data-theme='dark'] {
        --bg: #0e1120;
        --cd: #181c2f;
        --tx: #eef0f8;
        --mu: #a3a9c4;
        --bd: #2a3050;
        --crm: #60a5fa;
        --scm: #fb923c;
        --erp: #2dd4bf;
        --km: #a78bfa;
        --rel: #cbd5e1;
      }
      html {
        scroll-padding-top: env(safe-area-inset-top, 0px);
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        background: var(--bg);
        color: var(--tx);
        font-family:
          system-ui,
          -apple-system,
          'Segoe UI',
          Roboto,
          sans-serif;
        line-height: 1.45;
      }
      .w {
        max-width: 1000px;
        margin: 0 auto;
        padding: 0 14px 20px;
      }
      .nav {
        position: sticky;
        top: env(safe-area-inset-top, 0px);
        z-index: 5;
        background: var(--bg);
        padding: 10px 0;
        display: flex;
        gap: 8px;
        overflow-x: auto;
        scrollbar-width: none;
      }
      .nav::-webkit-scrollbar {
        display: none;
      }
      .nav button {
        flex: none;
        font: inherit;
        font-size: 14px;
        font-weight: 700;
        cursor: pointer;
        border: 2px solid var(--c);
        color: var(--c);
        background: var(--cd);
        border-radius: 99px;
        padding: 8px 16px;
        white-space: nowrap;
      }
      .nav button[aria-selected='true'] {
        background: var(--c);
        color: var(--bg);
      }
      .nav button:focus-visible {
        outline: 3px solid var(--tx);
        outline-offset: 2px;
      }
      .p {
        display: none;
        --ks: color-mix(in srgb, var(--k) 9%, transparent);
      }
      .p.on {
        display: block;
      }
      .hd {
        display: flex;
        gap: 16px;
        align-items: center;
        flex-wrap: wrap;
        background: var(--k);
        color: var(--bg);
        border-radius: 18px;
        padding: 22px;
      }
      .hd .ic {
        font-size: 56px;
      }
      .hd h1 {
        margin: 0;
        font-size: clamp(24px, 5vw, 38px);
        line-height: 1.15;
      }
      .hd p {
        margin: 6px 0 0;
        opacity: 0.92;
      }
      .hd .t {
        flex: 1;
        min-width: 220px;
      }
      .sec {
        background: var(--cd);
        border: 1px solid var(--bd);
        border-radius: 14px;
        padding: 16px;
        margin-top: 14px;
      }
      .sec > h2 {
        margin: 0 0 10px;
        font-size: 13px;
        letter-spacing: 0.09em;
        text-transform: uppercase;
        color: var(--k);
      }
      .sec p {
        margin: 0;
        font-size: 15px;
      }
      .steps {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(170px, 1fr));
        gap: 10px;
      }
      .st {
        background: var(--ks);
        border-radius: 12px;
        padding: 12px;
        text-align: center;
        font-size: 13px;
      }
      .st b {
        display: block;
        font-size: 14px;
        margin: 4px 0;
      }
      .st .n {
        display: inline-block;
        background: var(--k);
        color: var(--bg);
        border-radius: 50%;
        width: 24px;
        height: 24px;
        line-height: 24px;
        font-size: 13px;
        font-weight: 700;
      }
      .st small {
        display: block;
        margin-top: 8px;
        padding-top: 8px;
        border-top: 1px dashed var(--k);
        text-align: left;
        color: var(--mu);
        font-size: 13px;
      }
      .st .e {
        font-size: 28px;
        display: block;
        margin: 4px 0;
      }
      .g2 {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
        gap: 14px;
      }
      .g2 .sec {
        margin-top: 14px;
      }
      .kv {
        display: grid;
        gap: 8px;
      }
      .kv div {
        font-size: 14px;
        border-left: 4px solid var(--k);
        padding-left: 10px;
      }
      .kv b {
        display: block;
        color: var(--k);
      }
      ul {
        margin: 0;
        padding-left: 20px;
        font-size: 14px;
      }
      li {
        margin: 4px 0;
      }
      .ok li {
        list-style: '✅ ';
      }
      .no li {
        list-style: '⚠️ ';
      }
      .tags {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
      }
      .tags span {
        border: 1.5px solid var(--k);
        color: var(--k);
        border-radius: 99px;
        padding: 3px 12px;
        font-size: 13px;
        font-weight: 600;
      }
      .kp {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(130px, 1fr));
        gap: 10px;
      }
      .kp div {
        background: var(--ks);
        border-radius: 12px;
        padding: 10px;
        text-align: center;
        font-size: 12px;
        color: var(--mu);
      }
      .kp em {
        display: block;
        font-style: normal;
        font-size: 11px;
        font-weight: 600;
        color: var(--k);
        margin: 2px 0 6px;
      }
      .kp b {
        display: block;
        font-size: 20px;
        color: var(--k);
      }
      .cr {
        position: relative;
        margin-top: 14px;
      }
      .cr-view {
        overflow: hidden;
        border-radius: 14px;
        border: 1px solid var(--bd);
        background: var(--cd);
      }
      .cr-track {
        display: flex;
        transition: transform 0.5s ease;
      }
      .cr-slide {
        flex: 0 0 100%;
        margin: 0;
        padding: 14px;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 10px;
      }
      .cr-slide img {
        width: auto;
        max-width: 100%;
        max-height: min(62vh, 520px);
        object-fit: contain;
        border-radius: 10px;
      }
      .cr-slide figcaption {
        font-size: 14px;
        color: var(--mu);
        text-align: center;
        max-width: 560px;
      }
      .cr-bar {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 10px;
        margin-top: 10px;
        flex-wrap: wrap;
      }
      .cr-bar button {
        font: inherit;
        font-weight: 700;
        cursor: pointer;
        border: 2px solid var(--c);
        color: var(--c);
        background: var(--cd);
        border-radius: 99px;
        min-width: 44px;
        height: 40px;
        padding: 0 14px;
      }
      .cr-bar button:focus-visible {
        outline: 3px solid var(--tx);
        outline-offset: 2px;
      }
      .cr-dots {
        display: flex;
        gap: 8px;
      }
      .cr-dots button {
        min-width: 0;
        width: 14px;
        height: 14px;
        padding: 0;
        border-radius: 50%;
        border-width: 2px;
      }
      .cr-dots button[aria-current='true'] {
        background: var(--c);
      }
      .cr-prog {
        height: 4px;
        border-radius: 4px;
        background: var(--bd);
        margin-top: 10px;
        overflow: hidden;
      }
      .cr-prog i {
        display: block;
        height: 100%;
        width: 0;
        background: var(--c);
      }
      .qi {
        display: flex;
        gap: 14px;
        align-items: center;
        flex-wrap: wrap;
      }
      .qi img {
        flex: 0 1 260px;
        width: 260px;
        max-width: 100%;
        height: auto;
        border-radius: 12px;
        border: 1px solid var(--bd);
      }
      .qi .q {
        flex: 1 1 240px;
      }
      .cr-slide img {
        cursor: zoom-in;
      }
      .lb {
        position: fixed;
        inset: 0;
        z-index: 50;
        display: none;
        align-items: center;
        justify-content: center;
        background: rgba(0, 0, 0, 0.88);
        padding: calc(56px + env(safe-area-inset-top, 0px)) 12px calc(16px + env(safe-area-inset-bottom, 0px));
      }
      .lb.on {
        display: flex;
      }
      .lb img {
        max-width: 100%;
        max-height: 100%;
        object-fit: contain;
        border-radius: 8px;
        background: #fff;
      }
      .lb-x {
        position: absolute;
        top: calc(8px + env(safe-area-inset-top, 0px));
        right: 12px;
        width: 44px;
        height: 44px;
        border-radius: 50%;
        border: 2px solid #fff;
        background: rgba(0, 0, 0, 0.6);
        color: #fff;
        font: inherit;
        font-size: 22px;
        line-height: 1;
        font-weight: 700;
        cursor: pointer;
      }
      .lb-x:focus-visible {
        outline: 3px solid #fff;
        outline-offset: 3px;
      }
      .q {
        border-left: 5px solid var(--k);
        background: var(--ks);
        border-radius: 10px;
        padding: 12px 14px;
        font-size: 15px;
        font-weight: 600;
      }
      .sg {
        margin-top: 14px;
        background: var(--ks);
        border: 1.5px dashed var(--k);
        border-radius: 12px;
        padding: 12px 14px;
        font-size: 15px;
      }
      .sg b {
        color: var(--k);
      }
      .cs {
        margin: 0 0 12px !important;
        font-size: 14px !important;
        color: var(--mu);
      }
      .ft {
        text-align: center;
        color: var(--mu);
        font-size: 13px;
        margin: 16px 0 4px;
      }
      /* relación */
      .hd.rel {
        background: linear-gradient(120deg, var(--crm), var(--erp), var(--scm));
        color: #fff;
      }
      .sgr {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
        gap: 10px;
      }
      .sgr div {
        border-left: 5px solid var(--c);
        padding: 6px 10px;
        font-size: 14px;
      }
      .sgr b {
        color: var(--c);
        font-size: 17px;
      }
      .km {
        --c: var(--km);
      }
      .crm {
        --c: var(--crm);
      }
      .scm {
        --c: var(--scm);
      }
      .erp {
        --c: var(--erp);
      }
      .ans {
        border: 2px solid var(--erp);
        border-radius: 14px;
        padding: 16px;
        margin-top: 14px;
        background: var(--cd);
      }
      .ans h2 {
        margin: 0 0 8px;
        font-size: 18px;
      }
      .ans p {
        margin: 6px 0;
        font-size: 15px;
      }
      .map {
        display: grid;
        grid-template-columns: 1fr auto 1.25fr auto 1fr;
        gap: 8px;
        align-items: stretch;
      }
      .nd {
        border: 2px solid var(--c);
        border-radius: 14px;
        padding: 12px;
        text-align: center;
        font-size: 13px;
      }
      .nd .t {
        display: inline-block;
        background: var(--c);
        color: var(--bg);
        font-weight: 800;
        border-radius: 99px;
        padding: 2px 12px;
        font-size: 14px;
      }
      .nd .e {
        font-size: 30px;
        display: block;
        margin: 6px 0 2px;
      }
      .nd b {
        display: block;
        font-size: 14px;
      }
      .ar {
        align-self: center;
        font-size: 24px;
        color: var(--mu);
      }
      .cap {
        margin: 10px 0 0 !important;
        font-size: 14px !important;
        color: var(--mu);
      }
      @media (max-width: 640px) {
        .map {
          grid-template-columns: 1fr;
        }
        .ar {
          transform: rotate(90deg);
          justify-self: center;
        }
      }
      .tb {
        overflow-x: auto;
      }
      table {
        border-collapse: collapse;
        width: 100%;
        min-width: 560px;
        font-size: 13px;
      }
      th,
      td {
        border: 1px solid var(--bd);
        padding: 8px;
        text-align: left;
        vertical-align: top;
      }
      th {
        color: var(--c);
      }
      td:first-child {
        font-weight: 700;
        color: var(--mu);
      }
      .sx {
        display: grid;
        gap: 10px;
      }
      .s {
        display: flex;
        gap: 10px;
        align-items: flex-start;
        font-size: 14px;
      }
      .s .n {
        flex: none;
        width: 26px;
        height: 26px;
        border-radius: 50%;
        background: var(--mu);
        color: var(--bg);
        text-align: center;
        line-height: 26px;
        font-weight: 700;
        font-size: 13px;
      }
      .bd {
        flex: none;
        min-width: 48px;
        text-align: center;
        background: var(--c);
        color: var(--bg);
        font-weight: 800;
        border-radius: 8px;
        padding: 2px 8px;
        font-size: 12px;
      }
      .op {
        border: 1px solid var(--bd);
        border-top: 5px solid var(--erp);
        border-radius: 12px;
        padding: 12px;
        font-size: 14px;
      }
      .op b {
        display: block;
        font-size: 15px;
        margin-bottom: 4px;
      }
      .g3 {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
        gap: 12px;
      }
      a {
        color: var(--km);
      }
      .rf {
        font-size: 14px;
        padding-left: 20px;
        margin: 0;
      }
      .rf li {
        margin: 8px 0;
        list-style: none;
        text-indent: -20px;
        padding-left: 20px;
      }
    </style>
  </head>
  <body>
    <div class="lb" id="lb" role="dialog" aria-modal="true" aria-label="Imagen ampliada"><button type="button" class="lb-x" id="lb-x" aria-label="Cerrar imagen">✕</button><img id="lb-img" alt="" /></div>
    <div class="w">
      <nav
        class="nav"
        role="tablist"
        id="nav"
      ></nav>
      <main id="main"></main>
      <p class="ft">Guárdalo y compártelo con tu equipo</p>
    </div>

      const REL = `<div class="hd rel"><div class="t"><h1>CRM, SCM y ERP: ¿cómo se relacionan?</h1><p>No son lo mismo ni uno es "el grande" de los otros: cada uno cuida una parte distinta de la empresa.</p></div></div>
<div class="sec"><h2 style="color:var(--mu)">Primero, qué significa cada sigla</h2><div class="sgr">
<div class="crm"><b>CRM</b><br>Customer Relationship Management<br>= Gestión de la Relación con el Cliente</div>
<div class="scm"><b>SCM</b><br>Supply Chain Management<br>= Gestión de la Cadena de Suministro</div>
<div class="erp"><b>ERP</b><br>Enterprise Resource Planning<br>= Planificación de Recursos Empresariales</div></div></div>
<div class="ans"><h2>¿Quién contiene a quién?</h2>
<p><b>Como idea: ninguno contiene a los otros.</b> Cada uno resuelve algo distinto (clientes, proveedores, o la empresa por dentro).</p>
<p><b>Como programa: lo más común es que el ERP sea la base</b> y traiga el CRM y el SCM como secciones, o se conecte a ellos.</p>
<p>Lo contrario casi no pasa: un CRM o un SCM normalmente no incluyen un ERP completo.</p></div>
<div class="sec"><h2 style="color:var(--mu)">El mapa: cada uno mira a un lado distinto</h2><div class="map">
<div class="nd scm"><span class="t">SCM</span><span class="e">🏭</span><b>Mira hacia los proveedores</b>Cuida que el producto llegue a tiempo y sin gastar de más.</div><div class="ar">⇄</div>
<div class="nd erp"><span class="t">ERP</span><span class="e">🏢</span><b>La empresa por dentro</b>Ventas, bodega, compras, dinero y personal, en un solo programa con los mismos datos.</div><div class="ar">⇄</div>
<div class="nd crm"><span class="t">CRM</span><span class="e">👥</span><b>Mira hacia los clientes</b>Guarda quién es cada cliente y cuándo volver a escribirle.</div></div>
<p class="cap">Piensa en una casa: el ERP es la casa, el CRM es la puerta hacia los clientes y el SCM es la puerta hacia los proveedores.</p></div>
<div class="sec"><h2 style="color:var(--mu)">Comparación rápida</h2><div class="tb"><table>
<tr><th></th><th style="--c:var(--crm)">CRM</th><th style="--c:var(--scm)">SCM</th><th style="--c:var(--erp)">ERP</th></tr>

<tr><td>¿Qué pregunta responde?</td><td>¿Quién me compra y cómo lo atiendo?</td><td>¿Cómo llega el producto a tiempo y sin gastar de más?</td><td>¿Cómo van el dinero, la bodega y el personal?</td></tr>
<tr><td>¿Con quién se relaciona?</td><td>Clientes</td><td>Proveedores y empresas de transporte</td><td>Todas las áreas de la empresa</td></tr>
<tr><td>Tipo de sistema y área</td><td>TPS (transaccional) · área de ventas, la parte más externa</td><td>MIS · área operacional (inventarios y cadena de suministro)</td><td>MIS · área operacional, la parte más interna</td></tr>
<tr><td>Programas que se usan</td><td>Salesforce, HubSpot</td><td>Kinaxis, Blue Yonder</td><td>SAP, Oracle, Odoo</td></tr></table></div></div>
<div class="sec"><h2 style="color:var(--km)">🧠 ¿Y dónde entra la gestión del conocimiento (KM)?</h2><p>El KM no es una puerta más: es la <b>memoria</b> de la casa. El CRM y el ERP guardan <b>datos</b> (quién compró, cuánto hay en bodega); el KM guarda el <b>saber hacer</b> (cómo atender ese reclamo, cómo cerrar el mes en el ERP). Atraviesa todas las áreas.</p><div class="tb" style="margin-top:10px"><table>
<tr><th></th><th style="--c:var(--crm)">CRM</th><th style="--c:var(--erp)">ERP</th><th style="--c:var(--km)">KM</th></tr>
<tr><td>Guarda</td><td>Datos de clientes y tratos</td><td>Datos de la operación</td><td>Guías, procedimientos y experiencia</td></tr>
<tr><td>Responde</td><td>¿Quién es y qué quiere?</td><td>¿Qué pasó y cuánto hay?</td><td>¿Cómo se hace bien?</td></tr>
<tr><td>Usuario típico</td><td>Ventas y soporte</td><td>Todas las áreas</td><td>Todo el equipo, sobre todo el nuevo</td></tr></table></div></div>
<div class="sec"><h2 style="color:var(--mu)">Los tres trabajando juntos: una venta de «Zapatos Sol»</h2><div class="sx">
<div class="s"><span class="n">1</span><span class="bd crm">CRM</span><span>Valeria deja sus datos en la web de la tienda para pedir unas zapatillas talla 40. El CRM crea su ficha y le avisa al vendedor.</span></div>
<div class="s"><span class="n">2</span><span class="bd erp">ERP</span><span>Valeria compra. El ERP registra el pedido, descuenta el par del inventario y genera la factura (el comprobante de la venta).</span></div>
<div class="s"><span class="n">3</span><span class="bd scm">SCM</span><span>Quedan 20 pares de esa talla. Esta parte avisa «Queda poco» y propone pedir más a la fábrica.</span></div>
<div class="s"><span class="n">4</span><span class="bd erp">ERP</span><span>Cuando llegan las zapatillas nuevas, el ERP registra la compra y lo que hay que pagarle a la fábrica.</span></div>
<div class="s"><span class="n">5</span><span class="bd crm">CRM</span><span>Una semana después, el CRM le envía a Valeria un correo para preguntarle si le gustaron las zapatillas.</span></div></div>
<p class="cap">💡 Si la tienda usa un ERP que trae las tres secciones, todo esto pasa dentro de un solo programa. Si no, cada paso ocurre en un programa distinto, conectados entre sí.</p></div>
<div class="sec"><h2 style="color:var(--mu)">Tres formas de tenerlos en la práctica</h2><div class="g3">
<div class="op"><b>1. Todo en uno</b>Un ERP que ya trae el CRM y el SCM como secciones (por ejemplo Odoo o SAP). Ventaja: un solo lugar y los mismos datos. A veces sus secciones son menos completas que un programa especializado.</div>

<div class="sec" style="--k:var(--erp);--ks:color-mix(in srgb,var(--erp) 9%,transparent)"><div class="q">💡 CRM, SCM y ERP no compiten: el ERP es la base de la empresa, el CRM la conecta con los clientes y el SCM con los proveedores.</div></div>`;

<div class="sec"><h2 style="color:var(--mu)">Introducción</h2><p>Las organizaciones actuales dependen de la información para atender a sus clientes, aprovechar lo que saben sus equipos y lograr que sus productos lleguen en el momento y lugar correctos. Este trabajo presenta tres enfoques de gestión que lo hacen posible: la Gestión de la Relación con el Cliente (CRM, <i>Customer Relationship Management</i>), la Gestión de la Cadena de Suministro (SCM, <i>Supply Chain Management</i>) y la Gestión del Conocimiento (KM, <i>Knowledge Management</i>). KPI corresponde a <i>Key Performance Indicator</i> (indicador clave de desempeño). Se conservan las siglas en inglés porque son las más usadas en la práctica.</p>
<p class="cap">El objetivo es explicar qué es cada enfoque, cómo funciona, qué beneficios aporta, con qué programas se implementa y cómo se mide su desempeño. El contenido parte de tres infografías de elaboración propia y se respalda con definiciones de IBM (s. f.-a, s. f.-b) y del CSCMP (s. f.).</p></div>

<div class="scm"><b>SCM</b><br>Supply Chain Management<br>= Gestión de la Cadena de Suministro</div>
<div class="km"><b>KM</b><br>Knowledge Management<br>= Gestión del Conocimiento</div></div></div>
<div class="sec"><h2 style="color:var(--mu)">Comparación de los tres enfoques</h2><div class="tb"><table>

<tr><td>Error frecuente</td><td>Datos incompletos o equipo que no lo usa</td><td>Depender de un solo proveedor o adivinar la demanda</td><td>Guías que nunca se actualizan</td></tr></table></div>
<p class="cap">Aunque cada enfoque atiende un ámbito distinto, comparten una lógica común: ordenar la información, repartirla entre las personas que la necesitan y medir resultados con indicadores.</p></div>
<div class="sec"><h2 style="color:var(--mu)">La idea central de cada infografía</h2><div class="sgr">
<div class="crm"><b>CRM</b><br>Poner al cliente primero.</div>
<div class="scm"><b>SCM</b><br>Una cadena es tan fuerte como su parte más débil.</div>
<div class="km"><b>KM</b><br>Lo que no se escribe se pierde cuando alguien se va.</div></div></div>
<div class="sec"><h2 style="color:var(--mu)">Conclusiones</h2><p>El CRM busca conocer y cuidar a los clientes para vender más, el SCM busca que el producto llegue bien, a tiempo y sin gastar de más, y la gestión del conocimiento busca guardar y compartir lo que sabe el equipo. Cada uno recorre seis etapas y se mide con cinco indicadores propios.</p>
<p class="cap">Qué conviene hacer en cada caso: en el CRM, definir primero cómo se vende y después elegir el programa; en el SCM, compartir información con los proveedores y tener un plan por si algo falla; y en la gestión del conocimiento, dar a cada guía una persona responsable y reconocer a quien comparte lo que sabe.</p></div>

<div class="cr-prog"><i id="cr-prog"></i></div>
<div class="cr-bar"><button type="button" id="cr-prev" aria-label="Anterior">◀</button><div class="cr-dots" id="cr-dots"></div><button type="button" id="cr-next" aria-label="Siguiente">▶</button><button type="button" id="cr-play" aria-label="Pausar">⏸ Pausar</button></div></div>`;
      const L = (a) => a.map((x) => `<li>${x}</li>`).join('');
      function render(d) {
        return `<div class="hd"><div class="ic">${d.ic}</div><div class="t"><h1>${d.h}</h1><p>${d.sub}</p></div></div>
<div class="sg">${d.sg}</div>
<div class="sec"><h2>¿Qué es?</h2><p>${d.w}</p></div>${d.ar ? `<div class="sec"><h2>${d.ar.h}</h2><p>${d.ar.t}</p>${d.ar.l ? `<ul class="ok" style="margin-top:8px">${L(d.ar.l)}</ul>` : ''}${d.ar.n ? `<p class="cap">${d.ar.n}</p>` : ''}</div>` : ''}
<div class="sec"><h2>¿Cómo funciona? (un ejemplo paso a paso)</h2><p class="cs">${d.cs}</p><div class="steps">${d.st.map((s, i) => `<div class="st"><span class="n">${i + 1}</span><span class="e">${s[0]}</span><b>${s[1]}</b>${s[2]}<small>${s[3]}</small></div>`).join('')}</div></div>${d.int ? `<div class="g2">${d.int.lk.map((x) => `<div class="sec ${x[0]}" style="border-top:5px solid var(--c)"><h2 style="color:var(--c)">${x[1]}: qué se comparte</h2><ul class="ok">${L(x[2])}</ul></div>`).join('')}</div>` : ''}
<div class="g2"><div class="sec"><h2>Términos clave</h2><div class="kv">${d.kv.map((x) => `<div><b>${x[0]}</b>${x[1]}</div>`).join('')}</div></div>
<div class="sec"><h2>Beneficios</h2><ul class="ok">${L(d.ben)}</ul></div></div>
<div class="g2"><div class="sec"><h2>Programas que se usan</h2><div class="tags">${d.tools.map((t) => `<span>${t}</span>`).join('')}</div>${d.nt ? `<p class="cap">${d.nt}</p>` : ''}</div>
<div class="sec"><h2>Errores comunes</h2><ul class="no">${L(d.err)}</ul></div></div>
<div class="sec"><h2>KPIs (Key Performance Indicators = Indicadores Clave de Desempeño)</h2><p class="cs">Son números que te dicen si vas bien.</p><div class="kp">${d.kpi.map((x) => `<div><b>${x[0]}</b><em>${x[1]}</em>${x[2]}</div>`).join('')}</div></div>
<div class="sec"><h2>Buenas prácticas</h2><ul class="ok">${L(d.bp)}</ul></div>
<div class="sec">${d.img ? `<div class="qi"><img src="${d.img[0]}" alt="${d.img[1]}" loading="lazy" /><div class="q">💡 ${d.q}</div></div>` : `<div class="q">💡 ${d.q}</div>`}</div>`;
      }

      const nav = document.getElementById('nav'),
        main = document.getElementById('main');
      const T = [{ id: 'rel', k: 'rel', tab: '🔗 Relación', html: REL }]
        .concat(D.map((d) => ({ id: d.id, k: d.k, tab: d.tab, html: render(d) })))
        .concat([{ id: 'tr', k: 'rel', tab: '📋 Trabajo', html: REL2 }])
        .concat([{ id: 'memes', k: 'km', tab: '😂 Memes', html: MEMES }]);
      T.forEach((t) => {
        const b = document.createElement('button');
        b.textContent = t.tab;
        b.id = 'b-' + t.id;
        b.setAttribute('role', 'tab');
        b.style.setProperty('--c', 'var(--' + t.k + ')');
        b.onclick = () => show(t.id);
        nav.appendChild(b);
        const s = document.createElement('section');
        s.className = 'p';
        s.id = 'p-' + t.id;
        s.setAttribute('role', 'tabpanel');
        s.style.setProperty('--k', 'var(--' + t.k + ')');
        s.innerHTML = t.html;
        main.appendChild(s);
      });
      /* Carrusel de memes: gira solo cada 5 s mientras la pestaña está visible */
      const CR = (() => {
        const MS = 5000;
        const track = document.getElementById('cr-track');
        const n = track.children.length;
        const dots = document.getElementById('cr-dots');
        const prog = document.getElementById('cr-prog');
        const playBtn = document.getElementById('cr-play');
        const panel = document.getElementById('p-memes');
        const reduce = window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;
        let i = 0, playing = !reduce, t0 = 0, raf = 0, hold = false;
        for (let k = 0; k < n; k++) {
          const b = document.createElement('button');
          b.type = 'button';
          b.setAttribute('aria-label', 'Meme ' + (k + 1));
          b.onclick = () => go(k);
          dots.appendChild(b);
        }
        function go(k) {
          i = (k + n) % n;
          track.style.transform = 'translateX(' + -i * 100 + '%)';
          [...dots.children].forEach((d, j) => d.setAttribute('aria-current', j === i));
          t0 = performance.now();
        }
        function label() {
          playBtn.textContent = playing ? '⏸ Pausar' : '▶ Reanudar';
          playBtn.setAttribute('aria-label', playing ? 'Pausar' : 'Reanudar');
          if (!playing) prog.style.width = '0';
        }
        function tick(now) {
          raf = requestAnimationFrame(tick);
          if (!playing || hold || lb.classList.contains('on') || document.hidden || !panel.classList.contains('on')) { t0 = now - (parseFloat(prog.style.width) || 0) / 100 * MS; return; }
          const p = (now - t0) / MS;
          prog.style.width = Math.min(p, 1) * 100 + '%';
          if (p >= 1) go(i + 1);
        }
        document.getElementById('cr-prev').onclick = () => go(i - 1);
        document.getElementById('cr-next').onclick = () => go(i + 1);
        playBtn.onclick = () => { playing = !playing; t0 = performance.now(); label(); };
        const box = document.getElementById('cr');
        box.addEventListener('mouseenter', () => (hold = true));
        box.addEventListener('mouseleave', () => (hold = false));
        box.addEventListener('focusin', () => (hold = true));
        box.addEventListener('focusout', () => (hold = false));
        box.addEventListener('keydown', (e) => {
          if (e.key === 'ArrowLeft') go(i - 1);
          if (e.key === 'ArrowRight') go(i + 1);
        });
        let sx = null;
        box.addEventListener('touchstart', (e) => (sx = e.touches[0].clientX), { passive: true });
        box.addEventListener('touchend', (e) => {
          if (sx === null) return;
          const dx = e.changedTouches[0].clientX - sx;
          if (Math.abs(dx) > 40) go(i + (dx < 0 ? 1 : -1));
          sx = null;
        });
        /* Ampliar imagen */
        const lb = document.getElementById('lb'), lbImg = document.getElementById('lb-img'), lbX = document.getElementById('lb-x');
        let lastFocus = null;
        function openLb(img) {
          lastFocus = document.activeElement;
          lbImg.src = img.src;
          lbImg.alt = img.alt;
          lb.classList.add('on');
          document.body.style.overflow = 'hidden';
          lbX.focus();
        }
        function closeLb() {
          if (!lb.classList.contains('on')) return;
          lb.classList.remove('on');
          document.body.style.overflow = '';
          if (lastFocus && lastFocus.focus) lastFocus.focus();
        }
        track.querySelectorAll('img').forEach((im) => {
          im.tabIndex = 0;
          im.setAttribute('role', 'button');
          im.title = 'Clic para ampliar';
          im.onclick = () => openLb(im);
          im.onkeydown = (e) => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); openLb(im); } };
        });
        lbX.onclick = closeLb;
        lb.addEventListener('click', (e) => { if (e.target !== lbImg) closeLb(); });
        document.addEventListener('keydown', (e) => { if (e.key === 'Escape') closeLb(); });
        go(0);
        label();
        raf = requestAnimationFrame(tick);
        return { go, closeLb };
      })();
      function show(id, skip) {
        CR.closeLb();
        T.forEach((t) => {
          const on = t.id === id;
          document.getElementById('p-' + t.id).classList.toggle('on', on);
          const b = document.getElementById('b-' + t.id);
          b.setAttribute('aria-selected', on);
          if (on) b.scrollIntoView({ inline: 'center', block: 'nearest' });
        });
        if (!skip) {
          try {
            history.replaceState(null, '', '#' + id);
          } catch (e) {}
        }
        window.scrollTo(0, 0);
      }
      let h = 'crm';
      try {
        h = location.hash.slice(1);
      } catch (e) {}
      show(T.some((t) => t.id === h) ? h : 'crm', true);
    </script>
